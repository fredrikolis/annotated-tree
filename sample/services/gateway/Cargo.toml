# Concern: declares the gateway crate and the crates it depends on | Non-concern: the gateway's behaviour (src/ owns it) | IO: none
[package]
name = "gateway"
version = "0.1.0"
edition = "2021"
# This tree is a FIXTURE, but cargo cannot tell: `cargo install --git` searches the whole
# repository and refuses when two packages carry binaries. `src/main.rs` stays on disk because
# the rendered tree is frozen in tests/golden/; this only stops cargo auto-discovering it.
autobins = false

[dependencies]
shared = { path = "../shared" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
axum = "0.7"
