# Concern: the mechanical comment budget every commit is held to | Non-concern: what makes a comment worth keeping (docs/comment-standards.md owns that) | IO: none

[global]
exclude = ["target", "sample"]

[rules.line-length]
level = "deny"
soft_limit = 300
hard_limit = 300
url_exception = true

[rules.file-length]
level = "deny"
soft_limit = 2000
hard_limit = 2000

[rules.inline-comments]
level = "deny"
max_ratio = 0.20
max_consecutive = 1

# Per FILE, where inline-comments cannot see: it inspects function bodies only and never counts
# `///`, so module headers, item docs and impl blocks are unbounded without this.
#
# What this DOES bound: `//` runs anywhere in the file, including outside function bodies where
# inline-comments is blind, plus the `//` share of the file.
#
# What it deliberately does NOT bound: doc-comment volume. Both doc knobs are off after measuring
# what they cost here. A run cap fights rustdoc convention — this crate's `//!` front page is a
# published API doc whose example is fenced CODE, so any cap either permits an essay or demands
# deleting real documentation. And with docs counted, no achievable ratio separates a documented
# API surface from an essay: `exit.rs` is 12 lines of `pub const` and would be over 30% at its
# leanest. Doc quality stays a review concern, like annotation truth — the gate guarantees form,
# never worth.
[rules.file-comments]
level = "deny"
max_ratio = 0.30
count_doc_comments = false
max_consecutive = 1
max_doc_consecutive = 0

# Off deliberately, not by omission: these arrived with the pinned revision and are performance
# and style opinions this repo has not adopted. Left on they would fail commits over choices
# nobody made here.
[rules.string-alloc-in-loop]
level = "allow"

[rules.clone-density]
level = "allow"

[rules.verbose-result-handling]
level = "allow"

[rules.redundant-comments]
level = "allow"
