# Concern: the mechanical comment budget every commit is held to | Non-concern: what makes a comment worth keeping (`git-agent-verdict --standards programming` owns that) | IO: none

[global]
exclude = ["target", "sample"]

[rules.line-length]
level = "deny"
soft_limit = 300
hard_limit = 300
url_exception = true

[rules.file-length]
level = "deny"
soft_limit = 2000
hard_limit = 2000

[rules.inline-comments]
level = "deny"
max_ratio = 0.20
max_consecutive = 1

# Per FILE: catches `///` docs inline-comments misses.
[rules.file-comments]
level = "deny"
max_ratio = 0.30
count_doc_comments = true
max_consecutive = 1
max_doc_consecutive = 4

# Off: from the pinned revision, not adopted here.
[rules.string-alloc-in-loop]
level = "allow"

[rules.clone-density]
level = "allow"

[rules.verbose-result-handling]
level = "allow"

[rules.redundant-comments]
level = "allow"
