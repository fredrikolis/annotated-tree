[package]
name = "annotated-tree"
version = "0.6.0"
edition = "2021"
description = "Map an unfamiliar codebase in one command: an annotated directory tree with a cross-ecosystem (Python/npm/Cargo/Go) package dependency graph."
license = "MIT"
repository = "https://github.com/fredrikolis/annotated-tree"
readme = "README.md"
keywords = ["codebase", "dependency-graph", "tree", "monorepo", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "annotated-tree"
path = "src/main.rs"

[lib]
name = "annotated_tree"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = true
strip = true
codegen-units = 1
