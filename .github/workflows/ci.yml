# Concern: the checks every push and pull request must clear — fmt, clippy, tests, the annotation gate | Non-concern: cutting a release | IO: (push, PR) -> pass/fail
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all

  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Two runs (must match .githooks/pre-commit and local-release-check.sh): default prunes tests/, second adds it back except tests/fixtures.
      - run: cargo run --release -- --strict-check . --hidden --ignore sample --max-length 200
      - run: cargo run --release -- --strict-check . --hidden --ignore sample --include-tests -I 'tests/fixtures' --max-length 200

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./distribution

  # Freezes the download -> verify -> install contract end-to-end.
  installer-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Package release asset + checksum
        run: |
          set -eux
          # Host is linux x86_64 (glibc), but the installer only ships a musl asset for that platform — label it musl to match.
          target="x86_64-unknown-linux-musl"
          archive="annotated-tree-${target}.tar.gz"
          # Checksum name omits .tar.gz, matching the real release convention (see install.sh).
          checksum="annotated-tree-${target}.sha256"
          mkdir -p srv
          tar czf "srv/${archive}" -C target/release annotated-tree
          ( cd srv && sha256sum "${archive}" > "${checksum}" )
      - name: Serve assets
        run: |
          ( cd srv && python3 -m http.server 8137 >/dev/null 2>&1 & )
          for _ in $(seq 1 20); do
            if curl -fsS "http://localhost:8137/" >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
      - name: Run installer and assert it works
        run: |
          set -eux
          INSTALL_DIR="$(mktemp -d)"
          ANNOTATED_TREE_BASE_URL="http://localhost:8137" INSTALL_DIR="$INSTALL_DIR" \
            sh distribution/install.sh
          "$INSTALL_DIR/annotated-tree" --version
      - name: Assert checksum mismatch aborts without installing
        run: |
          set -eux
          target="x86_64-unknown-linux-musl"
          archive="annotated-tree-${target}.tar.gz"
          checksum="annotated-tree-${target}.sha256"
          printf 'deadbeef  %s\n' "$archive" > "srv/${checksum}"
          INSTALL_DIR="$(mktemp -d)"
          if ANNOTATED_TREE_BASE_URL="http://localhost:8137" INSTALL_DIR="$INSTALL_DIR" \
              sh distribution/install.sh; then
            echo "installer did not abort on checksum mismatch" >&2
            exit 1
          fi
          if [ -e "$INSTALL_DIR/annotated-tree" ]; then
            echo "installer left a binary behind despite mismatch" >&2
            exit 1
          fi

  npm-shim-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: main package.json is valid
        run: node -e "require('./distribution/npm/package.json')"
      - name: bin shim starts with a node shebang (npx/bin-link exec relies on it)
        run: |
          set -eux
          # `node <file>` below bypasses the shebang; npx doesn't — guard so the annotation can never displace it and silently break `npx annotated-tree`.
          test "$(head -1 distribution/npm/bin/annotated-tree.js)" = '#!/usr/bin/env node'
      - name: npm pack (main + a platform package)
        run: |
          set -eux
          npm pack --dry-run ./distribution/npm
          npm pack --dry-run ./distribution/npm/platforms/linux-x64-musl
      - name: Build release binary
        run: cargo build --release
      - name: Stage the built binary into the host platform package
        run: |
          set -eux
          # Placed at distribution/npm/node_modules, mimicking a real `npm install`'s optional-dep layout so require.resolve finds it.
          dest="distribution/npm/node_modules/annotated-tree-linux-x64-musl"
          mkdir -p "$dest"
          cp target/release/annotated-tree "$dest/"
          cp distribution/npm/platforms/linux-x64-musl/package.json "$dest/"
      - name: Shim forwards --version
        run: |
          set -eux
          node distribution/npm/bin/annotated-tree.js --version
      - name: Shim forwards a nonzero tool exit code
        run: |
          set -eux
          bad="$(mktemp -d)"
          printf '// no io contract here\n' > "$bad/bad.rs"
          code=0
          node distribution/npm/bin/annotated-tree.js --strict-check "$bad" || code=$?
          test "$code" -eq 1
      - name: Missing platform package errors explicitly (nonzero, not silent)
        run: |
          set -eux
          rm -rf distribution/npm/node_modules
          if node distribution/npm/bin/annotated-tree.js --version; then
            echo "expected the shim to fail when no platform package is installed" >&2
            exit 1
          fi
