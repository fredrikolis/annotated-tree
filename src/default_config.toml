# Concern: the built-in default configuration — limits, rules, display defaults, and the per-language comment markers | Non-concern: resolving these against the user, repo, and CLI layers | IO: none
# Precedence (low -> high): these defaults < ~/.config/annotated-tree/config.toml < ./.annotated-tree.toml < CLI flags.

[limits]
max_files = 10000

[rules]
deny = [] # e.g. [["web", "core"]] forbids package `web` depending on `core`
forbid_cycles = false
forbid_orphans = false
require_package_charter = false
max_annotation_length = 200

[display]
show_age = false
ascii = false
gitignore = true
hidden = false
include_tests = false
max_per_node = 50

[languages.python]
extensions = [".py"]
interpreters = ["python", "python3"]
comment = "#"
docstring = ['"""', "'''"]

[languages.rust]
extensions = [".rs"]
comment = "//"

[languages.go]
extensions = [".go"]
comment = "//"

[languages.typescript]
extensions = [".ts", ".tsx", ".js", ".jsx"]
comment = "//"

[languages.vue]
extensions = [".vue", ".svelte"]
block = ["<!--", "-->"]

[languages.shell]
extensions = [".sh", ".bash"]
interpreters = ["sh", "bash", "zsh", "dash", "ksh"]
comment = "#"

[languages.sql]
extensions = [".sql"]
comment = "--"

[languages.markdown]
extensions = [".md"]
block = ["<!--", "-->"]

[languages.toml]
extensions = [".toml"]
comment = "#"

[languages.yaml]
extensions = [".yml", ".yaml"]
comment = "#"
